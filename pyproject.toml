# ─────────────────────────────────────────────────────────────────────────────
# Rename placeholders when you spin up a new tool: run `python scripts/init.py`.
# It rewrites "mytool" (package/command) and the metadata below.
# ─────────────────────────────────────────────────────────────────────────────

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mytool"
version = "0.1.0"
description = "A starter command-line tool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brian Yee", email = "brian.alan.yee@gmail.com" }]
keywords = ["cli", "command-line", "template"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["click>=8.1"]

[project.urls]
Homepage = "https://github.com/brian-yee/mytool"
Repository = "https://github.com/brian-yee/mytool"
Issues = "https://github.com/brian-yee/mytool/issues"

# The console command. `mytool = "mytool.cli:main"` means installing the
# package puts a `mytool` executable on PATH that calls mytool.cli.main().
[project.scripts]
mytool = "mytool.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2", "twine>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/mytool"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
